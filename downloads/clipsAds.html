<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>clipsAds</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07070a;
    --elev: #101018;
    --surface: #14141c;
    --fg: #f4f7fb;
    --muted: #9aa3b2;
    --cyan: #00e5ff;
    --mint: #00ff88;
    --line: rgb(255 255 255 / 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050508; color: var(--fg); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #stage { min-height: 100dvh; display: grid; place-items: center; }
  .phone {
    position: relative;
    width: min(390px, 100vw);
    height: 100dvh;
    max-height: 880px;
    overflow: hidden;
    background: var(--bg);
  }
  @media (min-width: 520px) {
    .phone { height: min(880px, calc(100dvh - 24px)); border: 8px solid #25252c; border-radius: 38px; box-shadow: 0 25px 70px #000; }
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .slide { position: relative; height: 100%; min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always; background: #0b1520; }
  .slide video, .slide .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(#000b, transparent 18%, transparent 52%, #000c 100%); pointer-events: none; }
  .top { position: absolute; left: 0; right: 0; top: calc(8px + env(safe-area-inset-top)); z-index: 5; padding: 0 12px; pointer-events: none; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .brand, .user, .modes, .actions, .card, .nav button, .iconbtn { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #041018; font-weight: 800; }
  .word { font-family: Outfit, sans-serif; font-weight: 800; font-size: 18px; }
  .word b { color: var(--cyan); font-weight: 800; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .round { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: rgb(16 16 24 / .8); display: grid; place-items: center; }
  .pill { border-radius: 999px; background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #041018; font-size: 11px; font-weight: 800; padding: 8px 12px; }
  .user { margin-top: 8px; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 240px; background: rgb(16 16 24 / .82); border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px 4px 4px; backdrop-filter: blur(8px); }
  .ava { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--cyan); display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #041018; }
  .user span { font-size: 12px; font-weight: 800; }
  .follow { border-radius: 10px; padding: 4px 8px; font-size: 10px; font-weight: 800; background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #041018; }
  .follow.on { background: rgb(255 255 255 / .15); color: var(--fg); }
  .modes { margin: 8px auto 0; width: max-content; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgb(0 0 0 / .35); backdrop-filter: blur(8px); }
  .modes button { border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 800; color: rgb(244 247 251 / .8); }
  .modes button.on { background: var(--fg); color: #041018; }
  .actions { position: absolute; right: 6px; bottom: 230px; z-index: 4; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; }
  .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(160deg, #08303a, #041820); box-shadow: inset 0 0 0 2px #1ad4c8, 0 6px 14px rgb(0 229 255 / .25); color: var(--cyan); }
  .tile.on { color: var(--mint); box-shadow: inset 0 0 0 2px var(--mint), 0 0 12px rgb(0 255 136 / .45); }
  .card { position: absolute; left: 12px; right: 12px; bottom: 62px; z-index: 4; border-radius: 16px; border: 1px solid var(--line); background: rgb(18 18 24 / .82); backdrop-filter: blur(14px); padding: 8px 10px; }
  .pname { font-family: Outfit, sans-serif; font-weight: 800; font-size: 13px; }
  .psub { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .q { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .q p { flex: 1; margin: 0; font-size: 10px; font-weight: 800; line-height: 1.2; }
  .vote, .choice { border-radius: 999px; border: 1px solid rgb(255 255 255 / .15); background: rgb(0 0 0 / .4); padding: 4px 8px; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .vote.on, .choice.on { background: var(--mint); color: #041018; border-color: var(--mint); }
  .cta { margin-top: 6px; width: 100%; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--mint), var(--cyan)); color: #041018; font-weight: 800; font-size: 12px; }
  .nav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: rgb(7 7 10 / .92); border-top: 1px solid var(--line); }
  .nav button { font-size: 10px; font-weight: 700; color: #6b7380; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }
  .nav button.on { color: var(--cyan); }
  .sheet-bg { position: absolute; inset: 0; z-index: 8; background: rgb(0 0 0 / .55); display: none; align-items: flex-end; }
  .sheet-bg.on { display: flex; }
  .sheet { width: 100%; max-height: 78%; overflow: auto; background: var(--surface); border-radius: 25px 25px 0 0; padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
  .grab { width: 40px; height: 4px; border-radius: 99px; background: rgb(255 255 255 / .2); margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 12px; font-family: Outfit, sans-serif; font-size: 16px; }
  .opt { width: 100%; text-align: left; border-radius: 13px; padding: 14px; margin-bottom: 8px; font-weight: 700; background: #1c1c26; border: 1px solid var(--line); }
  .opt.primary { background: var(--cyan); color: #041018; border: 0; }
  .plain { height: 100%; padding: 28px 20px 80px; background: var(--bg); }
  .plain h2 { font-family: Outfit, sans-serif; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .gate { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; background: radial-gradient(circle at 50% 0, #15223a, var(--bg) 62%); text-align: center; }
  .gate .mark { width: 72px; height: 72px; border-radius: 18px; font-size: 28px; margin-bottom: 12px; }
  .gate h1 { margin: 0; font-family: Outfit, sans-serif; font-size: 34px; }
  .gate h1 b { color: var(--cyan); }
  .field { width: 100%; margin-top: 10px; background: var(--elev); border: 1px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; }
  .enter { width: 100%; margin-top: 16px; height: 52px; border-radius: 14px; font-weight: 800; background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #041018; }
  .cmt { font-size: 13px; margin: 0 0 8px; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div id="stage"><div class="phone" id="app"></div></div>
<script>
const V = [
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4"
];
const colors = ["#12303a", "#2a1a12", "#1a1230", "#102418", "#301018"];
let clips = [
  { id:"c1", handle:"laura.tech", author:"Laura", hue:"#2ee6d6", video:V[0], color:colors[0], city:"Madrid", product:"Audífonos Noise-Cancel Pro", brand:"SoundTech", price:"90€", cta:"Comprar ahora", comments:312, saves:586, shares:241, adYes:148, adNo:52, note:"Compra verificada · 14 días", local:false },
  { id:"c2", handle:"mario.cafe", author:"Mario", hue:"#7cffb2", video:V[1], color:colors[1], city:"Parla", product:"Cappuccino de especialidad", brand:"Cafetería Nexo", price:"3,50€", cta:"Reservar mesa", comments:46, saves:190, shares:38, adYes:90, adNo:30, note:"Negocio local", local:true },
  { id:"c3", handle:"diego.fade", author:"Diego", hue:"#ffb703", video:V[2], color:colors[2], city:"Parla", product:"Corte + barba", brand:"Barbería Norte", price:"18€", cta:"Reservar cita", comments:29, saves:102, shares:21, adYes:71, adNo:29, note:"Negocio local", local:true },
  { id:"c4", handle:"lucia.skin", author:"Lucía", hue:"#ff8ab7", video:V[3], color:colors[3], city:"Madrid", product:"Sérum vitamina C", brand:"Luma", price:"24€", cta:"Comprar ahora", comments:88, saves:410, shares:70, adYes:55, adNo:45, note:"Afiliado · 21 días", local:false },
  { id:"c5", handle:"nuria.fit", author:"Nuria", hue:"#9ad0ff", video:V[4], color:colors[4], city:"Leganés", product:"Clase de spinning", brand:"Box Sur", price:"9€", cta:"Reservar clase", comments:34, saves:156, shares:19, adYes:42, adNo:18, note:"Compra verificada · 30 días", local:true }
];
const state = {
  in: false, tab: "home", mode: "foryou", sound: false, i: 0,
  follow: {}, saved: {}, ad: {}, used: {}, sheet: null, comments: {
    c1: ["@sofia  ¿Aguantan el metro?", "@marcos  Tres semanas y cumplen."]
  }
};
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const app = document.getElementById("app");
const pct = (y, n) => { const t = y + n; if (!t) return [0, 0]; const a = Math.round(y * 100 / t); return [a, 100 - a]; };
const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace(".0","") + "K" : String(n);
function visible() {
  return state.mode === "discover" ? clips : clips.filter(c => !c.local || true).slice();
}
function render() {
  if (!state.in) { app.replaceChildren(gate()); return; }
  const root = document.createElement("div");
  root.style.height = "100%";
  if (state.tab === "home") root.append(feed());
  else root.append(plain());
  root.append(nav());
  if (state.sheet) root.append(sheet());
  app.replaceChildren(root);
  const sc = root.querySelector(".feed");
  if (sc && state.i) sc.children[state.i]?.scrollIntoView();
  bindFeed(root);
}
function gate() {
  const el = $(`<div class="screen on"><div class="gate">
    <div class="mark">▶</div>
    <h1>clips<b>Ads</b></h1>
    <p class="muted">Descubre, Opina y Compra Mejor.</p>
    <input class="field" id="mail" placeholder="Correo" />
    <input class="field" type="password" value="demo" placeholder="Contraseña" />
    <button class="enter" id="go">Entrar a clipsAds</button>
  </div></div>`);
  el.querySelector("#go").onclick = () => { state.in = true; render(); };
  return el;
}
function header(clip) {
  const f = !!state.follow[clip.handle];
  return `<div class="top">
    <div class="row">
      <div class="brand"><div class="mark">▶</div><div class="word">clips<b>Ads</b></div></div>
      <div class="tools">
        <button class="round" id="sound" aria-label="Sonido">${state.sound ? "♪" : "✕"}</button>
        <button class="pill" id="up">+ Subir Clip</button>
        <input id="file" type="file" accept="video/*" />
      </div>
    </div>
    <div class="user">
      <div class="ava" style="background:${clip.hue}">${clip.author[0]}</div>
      <span>@${clip.handle}</span>
      <button class="follow ${f ? "on" : ""}" id="follow">${f ? "Siguiendo" : "Seguir"}</button>
    </div>
    <div class="modes">
      <button class="${state.mode === "foryou" ? "on" : ""}" data-mode="foryou">Para ti</button>
      <button class="${state.mode === "discover" ? "on" : ""}" data-mode="discover">Descubre</button>
    </div>
  </div>`;
}
function feed() {
  const list = visible();
  const clip = list[state.i] || list[0];
  const wrap = document.createElement("div");
  wrap.className = "screen on";
  wrap.innerHTML = `<div class="feed" id="feed">${list.map(slide).join("")}</div>` + header(clip) + actions(clip) + card(clip);
  return wrap;
}
function slide(c) {
  return `<section class="slide" data-id="${c.id}" style="background:${c.color}">
    <video src="${c.video}" ${state.sound ? "" : "muted"} loop playsinline poster=""></video>
    <div class="shade"></div>
  </section>`;
}
function actions(c) {
  const saved = !!state.saved[c.id];
  return `<div class="actions">
    ${act("comment", fmt(c.comments), "comments", false)}
    ${act("save", fmt(c.saves + (saved ? 1 : 0)), "save", saved)}
    ${act("share", fmt(c.shares), "share", false)}
    ${act("more", "", "more", false)}
  </div>`;
}
function act(kind, label, id, on) {
  const svg = {
    comment: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h10v7H8l-3 3V6z"/><path d="M9 10h9v6h-3l-2 2v-2H9z"/></svg>`,
    save: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M6 18h12"/></svg>`,
    share: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="17" cy="17" r="2"/><path d="m8 11 7-3M8 13l7 3"/></svg>`,
    more: `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="1.4"/><circle cx="12" cy="7" r="1.4"/><circle cx="17" cy="7" r="1.4"/><circle cx="7" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="17" cy="12" r="1.4"/><circle cx="7" cy="17" r="1.4"/><circle cx="12" cy="17" r="1.4"/><circle cx="17" cy="17" r="1.4"/></svg>`
  }[kind];
  return `<button class="act" data-act="${id}"><span class="tile ${on ? "on" : ""}">${svg}</span>${label ? `<span>${label}</span>` : ""}</button>`;
}
function card(c) {
  const [y, n] = pct(c.adYes, c.adNo);
  const used = state.used[c.id];
  return `<div class="card">
    <button id="product" style="width:100%;text-align:left">
      <div class="pname">${c.product}</div>
      <div class="psub">${c.brand} · ${c.price} · ${c.city}</div>
    </button>
    <div class="q"><p>¿Te gusta este anuncio?</p>
      <button class="vote ${state.ad[c.id] === "yes" ? "on" : ""}" data-ad="yes">Sí ${y}%</button>
      <button class="vote ${state.ad[c.id] === "no" ? "on" : ""}" data-ad="no">No ${n}%</button>
    </div>
    <div class="q"><p>¿Lo has usado?</p>
      <button class="choice ${used === "yes" ? "on" : ""}" data-used="yes">Sí</button>
      <button class="choice ${used === "no" ? "on" : ""}" data-used="no">No</button>
    </div>
    <button class="cta" id="cta">${c.cta}</button>
  </div>`;
}
function nav() {
  const items = [["home","Inicio"],["explore","Explorar"],["create","Publicar"],["clips","Mis clips"],["profile","Perfil"]];
  const el = document.createElement("nav");
  el.className = "nav";
  el.innerHTML = items.map(([id, label]) => `<button class="${state.tab === id ? "on" : ""}" data-tab="${id}">${label}</button>`).join("");
  el.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; if (b.dataset.tab === "create") state.sheet = "upload"; render(); });
  return el;
}
function plain() {
  const titles = { explore: ["Explorar", "Categorías locales · Parla y sur de Madrid"], create: ["Publicar", "Elige un vídeo de tu galería."], clips: ["Mis clips", "Los que subas aparecen al inicio."], profile: ["Perfil", "Demo local. Sin cuenta real."] };
  const [t, s] = titles[state.tab] || ["clipsAds", ""];
  const el = $(`<div class="screen on"><div class="plain"><h2>${t}</h2><p class="muted">${s}</p>${state.tab === "create" ? `<button class="enter" id="pick">Elegir vídeo</button>` : ""}</div></div>`);
  return el;
}
function sheet() {
  const list = visible();
  const c = list[state.i] || clips[0];
  const bg = document.createElement("div");
  bg.className = "sheet-bg on";
  let body = "";
  if (state.sheet === "would") body = `<h3>¿Lo comprarías?</h3><p class="muted">Aún no lo has usado.</p><button class="opt primary" data-close>Sí, lo compraría</button><button class="opt" data-close>No lo compraría</button>`;
  else if (state.sheet === "comments") body = `<h3>Comentarios</h3><div id="cmts">${(state.comments[c.id] || []).map(t => `<p class="cmt">${t}</p>`).join("") || `<p class="muted">Sé el primero.</p>`}</div><input class="field" id="cmt" placeholder="Escribe un comentario" /><button class="enter" id="send">Publicar</button>`;
  else if (state.sheet === "share") body = `<h3>Compartir</h3><button class="opt primary" id="copy">Copiar enlace</button><button class="opt" data-close>Cerrar</button>`;
  else if (state.sheet === "more") body = `<h3>Opciones del anuncio</h3><button class="opt" data-close>No me interesa</button><button class="opt" data-close>Reportar</button><button class="opt" data-close>Cerrar</button>`;
  else if (state.sheet === "product") body = `<h3>Ficha</h3><p class="pname">${c.product}</p><p class="muted">${c.brand} · ${c.price} · ${c.city}</p><p class="muted">${c.note}</p><button class="opt primary" data-close>${c.cta}</button>`;
  else if (state.sheet === "cta") body = `<h3>${c.cta}</h3><p class="muted">Demo. No hay cobro real.</p><button class="opt primary" data-close>Continuar</button><button class="opt" data-close>Seguir viendo</button>`;
  else if (state.sheet === "upload") body = `<h3>Subir anuncio</h3><p class="muted">El vídeo se añade al inicio del feed.</p><button class="opt primary" id="pick2">Elegir vídeo de la galería</button><button class="opt" data-close>Cancelar</button>`;
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${body}</div>`;
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.hasAttribute("data-close")) { state.sheet = null; render(); } });
  const send = bg.querySelector("#send");
  if (send) send.onclick = () => {
    const v = bg.querySelector("#cmt").value.trim();
    if (!v) return;
    state.comments[c.id] = [`@tú  ${v}`, ...(state.comments[c.id] || [])];
    c.comments++;
    state.sheet = null;
    render();
  };
  const copy = bg.querySelector("#copy");
  if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText("https://clipsads.app/a/" + c.id); } catch (e) {} c.shares++; state.sheet = null; render(); };
  const pick = bg.querySelector("#pick2");
  if (pick) pick.onclick = () => document.getElementById("file")?.click() || pickFile();
  return bg;
}
function pickFile() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "video/*";
  input.onchange = () => addFile(input.files[0]);
  input.click();
}
function addFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  clips.unshift({ id: "u" + Date.now(), handle: "tu.clip", author: "Tú", hue: "#00e5ff", video: url, color: "#12303a", city: "Parla", product: "Tu anuncio", brand: "Local", price: "—", cta: "Ver anuncio", comments: 0, saves: 0, shares: 0, adYes: 0, adNo: 0, note: "Tu prueba", local: false });
  state.i = 0; state.tab = "home"; state.sheet = null; render();
}
function bindFeed(root) {
  const list = visible();
  const feedEl = root.querySelector("#feed");
  const play = () => {
    if (!feedEl) return;
    const mid = feedEl.scrollTop + feedEl.clientHeight / 2;
    let idx = 0;
    [...feedEl.children].forEach((el, i) => { if (el.offsetTop <= mid) idx = i; });
    if (idx !== state.i) { state.i = idx; render(); return; }
    feedEl.querySelectorAll("video").forEach((v, i) => {
      v.muted = !state.sound;
      if (i === idx) v.play().catch(() => {});
      else v.pause();
    });
  };
  feedEl?.addEventListener("scroll", () => {
    clearTimeout(feedEl._t);
    feedEl._t = setTimeout(play, 120);
  });
  play();
  const clip = list[state.i] || list[0];
  const sound = root.querySelector("#sound");
  if (sound) sound.onclick = () => { state.sound = !state.sound; render(); };
  const up = root.querySelector("#up");
  const file = root.querySelector("#file");
  if (up && file) { up.onclick = () => file.click(); file.onchange = () => addFile(file.files[0]); }
  const follow = root.querySelector("#follow");
  if (follow) follow.onclick = () => { state.follow[clip.handle] = !state.follow[clip.handle]; render(); };
  root.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; state.i = 0; render(); });
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const k = b.dataset.act;
    if (k === "save") state.saved[clip.id] = !state.saved[clip.id];
    state.sheet = k === "save" ? null : k;
    render();
  });
  root.querySelectorAll("[data-ad]").forEach(b => b.onclick = () => {
    const v = b.dataset.ad;
    if (state.ad[clip.id] === v) return;
    if (state.ad[clip.id] === "yes") clip.adYes = Math.max(0, clip.adYes - 1);
    if (state.ad[clip.id] === "no") clip.adNo = Math.max(0, clip.adNo - 1);
    if (v === "yes") clip.adYes++; else clip.adNo++;
    state.ad[clip.id] = v;
    render();
  });
  root.querySelectorAll("[data-used]").forEach(b => b.onclick = () => {
    const v = b.dataset.used;
    state.used[clip.id] = v;
    state.sheet = v === "no" ? "would" : null;
    render();
  });
  const product = root.querySelector("#product");
  if (product) product.onclick = () => { state.sheet = "product"; render(); };
  const cta = root.querySelector("#cta");
  if (cta) cta.onclick = () => { state.sheet = "cta"; render(); };
  const pick = root.querySelector("#pick");
  if (pick) pick.onclick = pickFile;
}
render();
</script>
</body>
</html>
