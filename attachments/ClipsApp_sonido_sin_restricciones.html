<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ClipsAds — Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root{--bg:#07070a;--panel:#14141b;--panel2:#1d1d27;--muted:#a1a1aa;--cyan:#00e5ff;--green:#00ff88;--pink:#ff3d9a}
body{background:#09090b;color:#fff;min-height:100vh;display:flex;justify-content:center;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}.app{width:100vw;height:100vh;max-width:430px;position:relative;background:#000;overflow:hidden}
@media(min-width:500px){.app{height:880px;margin:12px 0;border:8px solid #25252c;border-radius:38px;box-shadow:0 25px 70px #000}}
.view{position:absolute;inset:0;display:none}.view.active{display:flex}
#login{flex-direction:column;justify-content:space-between;padding:36px 22px;background:radial-gradient(circle at 50% 0,#15223a,#08080b 65%)}
.logo{text-align:center}.logoIcon{width:70px;height:70px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--cyan),var(--green));box-shadow:0 10px 35px #00e5ff44}
.logoImage{overflow:hidden;background:#08131b}.logoImage img{width:100%;height:100%;object-fit:cover}
.brandMark{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:6;display:flex;align-items:center;gap:7px;font-size:18px;font-weight:900;text-shadow:0 2px 10px #000}
.brandMark img{width:38px;height:38px;border-radius:12px;object-fit:cover;border:1px solid #00e5ff88;box-shadow:0 4px 16px #00e5ff44}
.brandMark span span{color:var(--cyan)}
.actions{left:0;right:auto;bottom:205px;align-items:flex-start}
.round{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;border-radius:0 18px 18px 0;border-left:0}
.round span{line-height:20px}
.round small{font-size:9px;color:#fff;font-weight:800}
.actions .round{background:#101018d9}
.creator{max-width:210px;margin-left:-14px}
.opinionBtns{display:flex;flex-direction:column;gap:6px;margin-top:7px;margin-left:-14px}
.opinion{width:max-content;max-width:210px;border:1px solid #00e5ff66;background:#0c1822dd;color:#fff;border-radius:16px;padding:7px 10px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}
.opinion:last-child{border-color:#00ff8866;background:#0b1c16dd}
.opinion b{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:5px;border-radius:50%;background:#00e5ff;color:#001014}
.opinion:last-child b{background:#00ff88}


.logo h1{font-size:34px;font-weight:900}.logo p{color:var(--muted);font-size:13px;margin-top:5px}
.tabs{display:flex;gap:4px;padding:4px;margin:28px 0 18px;background:#ffffff0c;border-radius:15px}.tabs button{flex:1;border:0;padding:11px;border-radius:12px;background:transparent;color:var(--muted);font-weight:700}.tabs .on{background:#ffffff12;color:#fff}
.form{display:flex;flex-direction:column;gap:13px}.group{display:flex;flex-direction:column;gap:6px}.label{font-size:12px;color:var(--muted);font-weight:700}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff18;background:#17171f;color:#fff;outline:0}.input:focus{border-color:var(--cyan)}
.submit{border:0;border-radius:15px;padding:14px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--green));color:#000;margin-top:4px}
.social{display:flex;flex-direction:column;gap:12px}.divider{display:flex;align-items:center;gap:10px;color:#666;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#ffffff15;flex:1}.google{border:1px solid #ffffff18;background:#ffffff08;color:#fff;padding:12px;border-radius:14px;font-weight:700}
#feed{background:#000}.video{position:absolute;inset:0}.video video{width:100%;height:100%;object-fit:cover;background:#111}.shade{position:absolute;inset:0;background:linear-gradient(#000b,transparent 25%,transparent 55%,#000 100%);pointer-events:none}
.soundBtn{position:absolute;right:12px;top:calc(61px + env(safe-area-inset-top));z-index:6;width:42px;height:42px;border:1px solid #ffffff20;border-radius:50%;background:#111117c9;color:#fff;backdrop-filter:blur(10px);font-size:18px;cursor:pointer}
.soundBtn:active{transform:scale(.94)}
.top{position:absolute;top:calc(61px + env(safe-area-inset-top));left:14px;right:14px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start}
.creator{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 5px;border-radius:24px;background:#111117c9;border:1px solid #ffffff22;backdrop-filter:blur(12px)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan)}.creatorName{font-size:12px;font-weight:800}.follow{border:0;border-radius:10px;padding:5px 8px;font-size:10px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--green))}
.following{background:#ffffff22;color:#fff}
.upload{border:0;border-radius:18px;padding:9px 12px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--green));color:#000}
.actions{position:absolute;right:12px;bottom:190px;z-index:4;display:flex;flex-direction:column;gap:9px}.round{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff20;background:#111117c9;color:#fff;backdrop-filter:blur(10px);font-size:20px}.round.active{color:var(--pink);border-color:#ff3d9a88}
.info{position:absolute;left:13px;right:13px;bottom:14px;z-index:4;padding:16px;border-radius:22px;background:#121218dc;border:1px solid #ffffff18;backdrop-filter:blur(16px)}
.userline{font-size:13px;font-weight:800;margin-bottom:5px}.product{font-size:18px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin:3px 0 11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.metric{background:#0008;border-radius:12px;padding:9px;text-align:center}.metric b{display:block;font-size:17px;color:var(--green)}.metric small{font-size:9px;color:#777;text-transform:uppercase}.metric:last-child b{color:var(--pink)}.buy{width:100%;border:0;padding:12px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--cyan));font-weight:900}
.bottomNav{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;padding:7px 0 calc(7px + env(safe-area-inset-bottom));background:#08080bd9;border-top:1px solid #ffffff10;backdrop-filter:blur(15px)}.navBtn{border:0;background:none;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.navBtn span{font-size:19px}.navBtn.on{color:#fff}
.modal{position:absolute;inset:0;z-index:20;background:#000b;display:none;align-items:flex-end;backdrop-filter:blur(5px)}.modal.open{display:flex}.sheet{width:100%;padding:22px 18px calc(20px + env(safe-area-inset-bottom));background:#17171f;border-radius:25px 25px 0 0;max-height:80%;overflow:auto}.sheet h3{text-align:center;margin-bottom:15px}.option{width:100%;border:1px solid #ffffff12;background:#252532;color:#fff;border-radius:13px;padding:13px;margin-bottom:9px;font-weight:700}.primary{background:var(--cyan);color:#000}.green{background:var(--green);color:#000}.close{background:#ffffff08}
.toast{position:absolute;left:50%;bottom:115px;transform:translateX(-50%) translateY(15px);opacity:0;z-index:50;background:#fff;color:#000;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
.library{position:absolute;inset:0;background:#09090c;padding:30px 16px}.library h2{margin-bottom:6px}.library p{color:var(--muted);font-size:12px;margin-bottom:20px}.clipItem{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #ffffff12;background:#14141b;border-radius:14px;margin-bottom:8px}.clipThumb{width:70px;height:48px;border-radius:9px;object-fit:cover;background:#222}.empty{color:#777;font-size:13px}

/* CONTROLES LATERALES: PEGADOS A LA ORILLA IZQUIERDA */
.actions{
  left:0 !important;
  right:auto !important;
  align-items:flex-start !important;
}
.actions .round{
  margin-left:0 !important;
}
.top > div:first-child{
  margin-left:0 !important;
}
.opinionBtns{
  margin-left:-14px !important;
}
.creator{
  margin-left:-14px !important;
}
@media(min-width:500px){
  .actions{left:0 !important}
  .top > div:first-child{margin-left:0 !important}
}


/* ICONOS DE ACCIÓN — estilo propio de ClipsAds, coherente con el logo cyan/verde */
.actionIcon{width:24px;height:24px;display:grid;place-items:center;font-size:27px;line-height:1;font-weight:900;font-family:Arial,sans-serif;transition:transform .18s ease,filter .18s ease}
.round:hover .actionIcon{transform:scale(1.12)}
.actionLike .actionIcon{color:var(--pink);font-size:28px}
.actionComment .actionIcon{color:var(--cyan);border:2px solid currentColor;border-radius:8px;width:21px;height:17px;font-size:0;position:relative}
.actionComment .actionIcon:after{content:"";position:absolute;bottom:-5px;left:4px;width:6px;height:6px;background:currentColor;clip-path:polygon(0 0,100% 0,0 100%)}
.actionSave .actionIcon{color:var(--green);width:19px;height:23px;border:2px solid currentColor;border-radius:5px 5px 7px 7px;font-size:0;position:relative}
.actionSave .actionIcon:after{content:"";position:absolute;left:3px;right:3px;bottom:-2px;height:8px;background:#111117c9;clip-path:polygon(0 0,50% 65%,100% 0,100% 100%,0 100%)}
.actionShare .actionIcon{color:var(--cyan);font-size:23px;transform:rotate(-18deg)}
.round.active .actionLike{filter:drop-shadow(0 0 6px #ff3d9a88)}
.round.active .actionSave .actionIcon{filter:drop-shadow(0 0 6px #00ff8888)}
</style>
</head>

function openDynamic(){let s=state.tested?`<h3>¿Qué tal funciona?</h3><button class="option" onclick="voteFunc('works')">¡Funciona perfecto! 👍</button><button class="option" onclick="voteFunc('mid')">A medias 😐</button><button class="option" onclick="voteFunc('broken')">No funciona 👎</button>`:`<h3>¿Lo usarías o comprarías?</h3><button class="option primary" onclick="voteIntent('yes')">Sí, me interesa ✨</button><button class="option" onclick="voteIntent('no')">No me interesa</button>`;$('sheet').innerHTML=s;$('modal').classList.add('open')}
function voteIntent(c){state.votes.intent[c]++;updateMetrics();closeSheet();toast(c==='yes'?'¡Voto registrado!':'Voto registrado')}
function voteFunc(c){state.votes.func[c]+=state.verified?3:1;updateMetrics();closeSheet();toast('Veredicto registrado'+(state.verified?' con peso de tester':''))}
function updateMetrics(){const f=state.votes.func,t=f.works+f.mid+f.broken;$('func').textContent=Math.round((f.works+f.mid*.5)/t*100)+'%';const i=state.votes.intent,ti=i.yes+i.no;$('intent').textContent=Math.round(i.yes/ti*100)+'%'}

function toggleSave(){
  state.saved=!state.saved;
  $('saveBtn').classList.toggle('active',state.saved);
  toast(state.saved?'Clip guardado':'Clip quitado de guardados');
}
function openComments(){
  $('sheet').innerHTML=`<h3>Comentarios</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="commentInput" class="input" placeholder="Escribe un comentario..." maxlength="160">
      <button class="option primary" style="width:auto;margin:0;padding:10px 13px" onclick="addComment()">Enviar</button>
    </div>
    <div id="comments">
      <div class="clipItem"><div><b>@sofia</b><div style="color:#aaa;font-size:11px">Se ve muy cómodo 👌</div></div></div>
      <div class="clipItem"><div><b>@marcos</b><div style="color:#aaa;font-size:11px">¿Alguien ya lo probó?</div></div></div>
      <div class="clipItem"><div><b>@vale</b><div style="color:#aaa;font-size:11px">Me interesa bastante.</div></div></div>
    </div>
    <button class="option close" onclick="closeSheet()">Cerrar</button>`;
  $('modal').classList.add('open');
}
function addComment(){
  const input=$('commentInput'), text=input?.value.trim();
  if(!text)return toast('Escribe algo primero');
  const box=$('comments');
  const row=document.createElement('div'); row.className='clipItem';
  row.innerHTML='<div><b>'+escapeHtml(state.user)+'</b><div style="color:#aaa;font-size:11px">'+escapeHtml(text)+'</div></div>';
  box.prepend(row);
  const count=parseInt($('commentCount').textContent.replace(/[^0-9]/g,''))||0;
  $('commentCount').textContent=(count+1);
  input.value='';
  toast('Comentario publicado');
}
function toggleSound(){
  video.muted=!video.muted;
  $('soundBtn').textContent=video.muted?'🔇':'🔊';
  $('soundBtn').setAttribute('aria-label',video.muted?'Activar sonido':'Silenciar');
  if(video.paused) video.play().catch(()=>{});
}

function handleVideoTap(){
  if(video.paused) video.play().catch(()=>{}); else video.pause();
}
video.addEventListener('click',handleVideoTap);

function pickVideo(input){if(!input.files[0])return;const url=URL.createObjectURL(input.files[0]);video.src=url;video.play().catch(()=>{});openSheet('new');$('sheet').insertAdjacentHTML('afterbegin','<p style="text-align:center;color:#00ff88;font-size:12px;margin-bottom:10px">✓ Vídeo seleccionado</p>');const btn=document.createElement('button');btn.className='option green';btn.textContent='Publicar clip';btn.onclick=publishClip;$('sheet').appendChild(btn)}
function publishClip(){const name=($('newName')?.value||'Nuevo producto').trim();const meta=($('newMeta')?.value||'Mi marca • precio').trim();$('product').textContent=name;$('meta').textContent=meta;$('creator').textContent=state.user;$('creatorLine').textContent=state.user;state.clips.unshift({name,meta,url:video.src,user:state.user});state.tested=false;state.verified=false;state.saved=false;state.liked=false;state.votes={func:{works:1,mid:0,broken:0},intent:{yes:1,no:0}};$('saveBtn').classList.remove('active');$('likeBtn').classList.remove('active');$('likeCount').textContent='0';$('commentCount').textContent='0';updateMetrics();closeSheet();toast('¡Clip publicado!');}
function renderClips(){if(!state.clips.length){$('clipList').innerHTML='<div class="empty">Todavía no has publicado ningún clip.</div>';return}$('clipList').innerHTML=state.clips.map(c=>`<div class="clipItem"><video class="clipThumb" src="${c.url}"></video><div><b>${escapeHtml(c.name)}</b><div style="color:#888;font-size:11px">${escapeHtml(c.meta)}</div></div></div>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function shareClip(){if(navigator.share){try{await navigator.share({title:'ClipsAds',text:'Mira este clip en ClipsAds'})}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);toast('Enlace copiado')}catch(e){toast('Compartir no disponible en este navegador')}}}
function fakeBuy(){closeSheet();toast('Demo: redirección a tienda simulada')}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>

<script>
(() => {
  const manifest={name:"ClipsAds",short_name:"ClipsAds",start_url:".",display:"standalone",background_color:"#07070a",theme_color:"#07070a",icons:[]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  const link=document.createElement("link");link.rel="manifest";link.href=URL.createObjectURL(blob);document.head.appendChild(link);
})();
</script>
