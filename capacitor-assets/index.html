<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <title>ClipsApp</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07070a; color: #f4f7fb; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 360px; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { color: #9aa3b2; line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #00e5ff; color: #07070a; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>ClipsApp</h1>
      <p>Necesitas conexión a Internet para abrir ClipsApp.</p>
      <a href="https://clipsapp.app">Reintentar</a>
    </main>
  </body>
</html>
